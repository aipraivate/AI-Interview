spring.application.name=interview-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=jdbc:h2:file:./data/interview;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.flyway.enabled=true
spring.h2.console.enabled=false
spring.jackson.default-property-inclusion=non_null
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.forward-headers-strategy=framework
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.ai.report-delay-ms=${APP_AI_REPORT_DELAY_MS:500}
app.ai.provider=${AI_PROVIDER:local}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gpt-4.1-mini}
app.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:250}
app.interview.expiry-poll-ms=${INTERVIEW_EXPIRY_POLL_MS:60000}
app.privacy.poll-delay-ms=${PRIVACY_POLL_DELAY_MS:5000}
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.rate-limit.redis-enabled=${RATE_LIMIT_REDIS_ENABLED:false}
spring.data.redis.repositories.enabled=false
